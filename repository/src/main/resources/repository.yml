spring:
  datasource:
    url: jdbc:postgresql://${db_host:localhost}:${db_port:5432}/orderdb
    username: ${db_username:orderdbuser}
    password: ${db_password:orderdbpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect